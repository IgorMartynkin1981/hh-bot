[package]
name = "hh_bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
thirtyfour = "0.35"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dirs = "5"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rand = "0.9"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
